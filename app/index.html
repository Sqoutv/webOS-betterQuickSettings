<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Better Quick Settings</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-dim="paper">
  <!-- Clicking the transparent backdrop outside the panel dismisses the overlay -->
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>

  <aside id="panel" class="panel is-visible" role="dialog" aria-label="Quick Settings">
    <header class="panel-header">
      <div class="title-group">
        <span class="app-title">Quick Settings</span>
        <span id="demo-badge" class="badge hidden">DEMO</span>
      </div>
      <div class="header-actions">
        <button
          type="button"
          id="btn-lg-settings"
          class="icon-btn focusable"
          data-nav="header"
          title="Open LG Standard Settings"
          aria-label="Open LG Standard Settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <button
          type="button"
          id="btn-config"
          class="icon-btn focusable"
          data-nav="header"
          title="Customize Quicksettings"
          aria-label="Customize Quicksettings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="4" y1="7" x2="10" y2="7"></line>
            <line x1="14" y1="7" x2="20" y2="7"></line>
            <circle cx="12" cy="7" r="2.2"></circle>
            <line x1="4" y1="17" x2="8" y2="17"></line>
            <line x1="12" y1="17" x2="20" y2="17"></line>
            <circle cx="10" cy="17" r="2.2"></circle>
          </svg>
        </button>

        <button
          type="button"
          id="btn-dim"
          class="icon-btn focusable"
          data-nav="header"
          title="UI Brightness (Paper White)"
          aria-label="UI Brightness (Paper White)"
        >
          <span id="dim-label">Paper</span>
        </button>

        <button
          type="button"
          id="btn-refresh"
          class="icon-btn focusable"
          data-nav="header"
          title="Reload Values"
          aria-label="Reload Values"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
          </svg>
        </button>

        <button
          type="button"
          id="btn-close"
          class="icon-btn focusable"
          data-nav="header"
          title="Close (Back)"
          aria-label="Close"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18"></line>
            <line x1="18" y1="6" x2="6" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <div class="panel-body">
      <!-- Quicksettings Customization Menu (Language & Layout Order) -->
      <section id="config-drawer" class="cc-card cc-config hidden" aria-labelledby="lbl-config-title">
        <div class="section-head">
          <span id="lbl-config-title" class="section-title">Customize Quicksettings</span>
        </div>

        <div class="config-block">
          <span id="lbl-config-lang" class="config-sub">Language</span>
          <div class="lang-grid">
            <button type="button" id="btn-lang-en" class="pill-btn focusable" data-lang="en">
              <span class="pill-label">English</span>
            </button>
            <button type="button" id="btn-lang-de" class="pill-btn focusable" data-lang="de">
              <span class="pill-label">Deutsch</span>
            </button>
          </div>
        </div>

        <div class="config-block">
          <span id="lbl-config-step" class="config-sub">Brightness Step</span>
          <div class="step-grid">
            <button type="button" id="btn-step-1" class="pill-btn step-btn focusable" data-step="1">
              <span class="pill-label">1 %</span>
            </button>
            <button type="button" id="btn-step-5" class="pill-btn step-btn focusable" data-step="5">
              <span class="pill-label">5 %</span>
            </button>
            <button type="button" id="btn-step-10" class="pill-btn step-btn focusable" data-step="10">
              <span class="pill-label">10 %</span>
            </button>
            <button type="button" id="btn-step-20" class="pill-btn step-btn focusable" data-step="20">
              <span class="pill-label">20 %</span>
            </button>
          </div>
        </div>

        <div class="config-block">
          <span id="lbl-config-sec-order" class="config-sub">Section Order</span>
          <div id="list-section-order" class="order-list"></div>
        </div>

        <div class="config-block">
          <span id="lbl-config-grp-order" class="config-sub">Group Tile Order</span>
          <div id="list-group-order" class="order-list"></div>
        </div>
      </section>

      <!-- Reorderable Main Sections -->
      <div id="sections-container" class="sections-container">
        <!-- HDMI Input Selector -->
        <section id="sec-hdmi" class="cc-card" data-section="hdmi" aria-labelledby="lbl-hdmi">
          <div class="section-head">
            <span id="lbl-hdmi" class="section-title">HDMI Input</span>
            <span id="val-hdmi" class="section-value">--</span>
          </div>
          <div id="grid-hdmi" class="hdmi-grid"></div>
        </section>

        <!-- OLED Brightness Slider (Apple Control Center Style) -->
        <section id="sec-brightness" class="cc-card cc-brightness" data-section="brightness" aria-labelledby="lbl-backlight">
          <div class="section-head">
            <span class="title-with-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="12" y1="2" x2="12" y2="5"></line>
                <line x1="12" y1="19" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="7.05" y2="7.05"></line>
                <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="5" y2="12"></line>
                <line x1="19" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="19.07" x2="7.05" y2="16.95"></line>
                <line x1="16.95" y1="7.05" x2="19.07" y2="4.93"></line>
              </svg>
              <span id="lbl-backlight" class="section-title">OLED Brightness</span>
            </span>
            <span id="val-backlight" class="section-value">--</span>
          </div>
          <div id="backlight-track" class="cc-slider-track">
            <div id="backlight-fill" class="cc-slider-fill"></div>
            <input
              type="range"
              id="range-backlight"
              class="cc-slider-input focusable"
              min="0"
              max="100"
              step="1"
              value="50"
              aria-label="OLED Brightness"
            >
          </div>
        </section>

        <!-- Group Tiles & Expandable Options Drawer -->
        <div id="sec-groups" class="sec-groups" data-section="groups">
          <div id="groups-grid" class="cc-groups-grid">
            <button type="button" id="group-btn-picture" class="group-tile focusable" data-group="picture">
              <span class="group-icon icon-indigo" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="13" rx="2.5"></rect>
                  <line x1="8" y1="20" x2="16" y2="20"></line>
                  <line x1="12" y1="17" x2="12" y2="20"></line>
                </svg>
              </span>
              <span class="group-meta">
                <span id="title-group-picture" class="group-title">Picture Mode</span>
                <span id="val-picture-mode" class="group-value">--</span>
              </span>
            </button>

            <button type="button" id="group-btn-sound" class="group-tile focusable" data-group="sound">
              <span class="group-icon icon-pink" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                  <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
                </svg>
              </span>
              <span class="group-meta">
                <span id="title-group-sound" class="group-title">Sound Mode</span>
                <span id="val-sound" class="group-value">--</span>
              </span>
            </button>

            <button type="button" id="group-btn-energy" class="group-tile focusable" data-group="energy">
              <span class="group-icon icon-green" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M17 8C8 10 5.9 16.17 3.82 21.34"></path>
                  <path d="M17 8c3 4 2.5 9.5-2 11.5-3.5 1.5-8 0-10.5-3.5C7 10.5 12 7 20 4c0 4-1 7-3 4z"></path>
                </svg>
              </span>
              <span class="group-meta">
                <span id="title-group-energy" class="group-title">Energy Saving</span>
                <span id="val-energy" class="group-value">--</span>
              </span>
            </button>
          </div>

          <section id="group-drawer" class="cc-card cc-drawer hidden" aria-labelledby="drawer-title">
            <div class="drawer-head">
              <span id="drawer-title" class="section-title">Options</span>
            </div>
            <div id="grid-picture-mode" class="pill-grid hidden"></div>
            <div id="grid-sound" class="pill-grid hidden"></div>
            <div id="sound-out-wrap" class="sub-row hidden">
              <span id="lbl-audio-out" class="sub-label">Audio Output</span>
              <span id="val-sound-out" class="sub-value">--</span>
            </div>
            <div id="grid-energy" class="pill-grid hidden"></div>
          </section>
        </div>
      </div>
    </div>
  </aside>

  <script src="js/luna.js"></script>
  <script src="js/settings-map.js"></script>
  <script src="js/preferences-store.js"></script>
  <script src="js/tv-controller.js"></script>
  <script src="js/spatial-navigator.js"></script>
  <script src="js/overlay-view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
